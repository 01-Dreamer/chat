# server
spring.application.name=chatserver
server.port=19090

# MySQL
spring.datasource.url=jdbc:mysql://CHANGE_ME_MYSQL_HOST:3306/CHANGE_ME_DATABASE_NAME?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=CHANGE_ME_MYSQL_USERNAME
spring.datasource.password=CHANGE_ME_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id

# 雪花 ID
chat.snowflake.worker-id=0
chat.snowflake.datacenter-id=0

# Redis
spring.data.redis.host=CHANGE_ME_REDIS_HOST
spring.data.redis.password=CHANGE_ME_REDIS_PASSWORD
spring.data.redis.port=6379
spring.data.redis.database=1
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1

# Sa-Token
sa-token.token-name=satoken
sa-token.timeout=2592000
sa-token.active-timeout=-1
sa-token.is-concurrent=false
sa-token.is-share=false
sa-token.is-read-header=true
sa-token.is-read-cookie=false
sa-token.token-style=uuid

# 登录限流
chat.rate-limit.login.max-attempts=10
chat.rate-limit.login.window-seconds=300

# RabbitMQ
spring.rabbitmq.host=CHANGE_ME_RABBITMQ_HOST
spring.rabbitmq.port=5672
spring.rabbitmq.username=CHANGE_ME_RABBITMQ_USERNAME
spring.rabbitmq.password=CHANGE_ME_RABBITMQ_PASSWORD
spring.rabbitmq.virtual-host=/
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.cache.channel.size=64
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=20

# MQ
chat.mq.message-queue=chat.message.persist.v1
chat.mq.realtime-exchange=chat.realtime.fanout.v1

# 文件上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
chat.file.max-size=536870912
chat.file.part-size=5242880

# 阿里云 OSS
aliyun.oss.endpoint=CHANGE_ME_OSS_ENDPOINT
aliyun.oss.accessKeyId=CHANGE_ME_OSS_ACCESS_KEY_ID
aliyun.oss.accessKeySecret=CHANGE_ME_OSS_ACCESS_KEY_SECRET
aliyun.oss.bucketName=CHANGE_ME_OSS_BUCKET_NAME

# 阿里云 ASR
aliyun.asr.api-key=CHANGE_ME_ASR_API_KEY
aliyun.asr.base-url=https://llm-CHANGE_ME.cn-beijing.maas.aliyuncs.com
aliyun.asr.model=qwen-audio-3.1-asr-flash-filetrans

# DeepSeek API
spring.ai.openai.api-key=CHANGE_ME_DEEPSEEK_API_KEY
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.model=deepseek-flash

# AI / ASR 请求限流
chat.rate-limit.ai.max-requests=20
chat.rate-limit.ai.window-seconds=60
chat.rate-limit.asr.max-requests=10
chat.rate-limit.asr.window-seconds=60
chat.rate-limit.message.max-requests=120
chat.rate-limit.message.window-seconds=60
chat.rate-limit.file-init.max-requests=30
chat.rate-limit.file-init.window-seconds=60
chat.cache.translation-hours=168
chat.cache.asr-hours=720

# WebRTC
chat.webrtc.stun-urls=stun:stun.l.google.com:19302
chat.webrtc.turn-urls=
chat.webrtc.turn-username=
chat.webrtc.turn-credential=
